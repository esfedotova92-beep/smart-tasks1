<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание 1. Мечта или цель?</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a; color: #e2e8f0;
    margin: 0; padding: 24px; line-height: 1.5;
  }
  .card {
    background: #1e293b; border: 1px solid #334155;
    border-radius: 16px; padding: 24px;
    max-width: 820px; margin: 0 auto;
  }
  h1 { color: #38bdf8; font-size: 1.4rem; margin-top: 0; }
  .hint { color: #94a3b8; font-size: 0.92rem; margin-top: -6px; }
  .item {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 10px; padding: 12px 16px; margin: 10px 0;
  }
  .item .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .item .text { flex: 1 1 260px; }
  .item .btns { display: flex; gap: 8px; }
  .item .btns button {
    font-family: inherit; font-size: 0.9rem; padding: 6px 14px;
    border: none; border-radius: 8px; background: #334155;
    color: #e2e8f0; cursor: pointer; transition: background .2s;
  }
  .item .btns button:hover { background: #475569; }
  .item .btns button.sel { outline: 2px solid #38bdf8; }
  .item .btns button.correct { background: #22c55e; color: #052e16; }
  .item .btns button.wrong { background: #ef4444; color: #450a0a; }
  .feedback { font-size: 0.9rem; margin-top: 6px; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { color: #4ade80; }
  .feedback.no { color: #f87171; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
  button.main {
    font-family: inherit; font-size: 1rem; padding: 10px 22px;
    border: none; border-radius: 10px; background: #38bdf8;
    color: #0f172a; font-weight: 700; cursor: pointer;
  }
  button.main:hover { background: #7dd3fc; }
  button.sec { background: #334155; color: #e2e8f0; }
  button.sec:hover { background: #475569; }
  .score { margin-top: 14px; font-weight: 700; color: #facc15; }
</style>
</head>
<body>
<div class="card">
  <h1>🎯 Задание 1. Мечта или цель?</h1>
  <p class="hint">Определи, что перед тобой: мечта/желание («хочу») или цель («хочу + срок + критерий»).</p>
  <div id="task1"></div>
  <div class="btn-row">
    <button class="main" id="check1">Проверить</button>
    <button class="main sec" id="reset1">Сбросить</button>
  </div>
  <div class="score" id="score1"></div>
</div>

<script>
const task1Data = [
  { text: "Хочу выучить испанский.", answer: "dream",
    why: "Это мечта: нет срока и критерия «как пойму, что выучил»." },
  { text: "Хочу прочитать книгу «Евгений Онегин».", answer: "dream",
    why: "Это мечта: непонятно, когда читать, до какого срока и как пойму, что прочитал (всю книгу? главы? конспект?)." },
  { text: "Хорошо бы когда-нибудь поучаствовать в олимпиаде.", answer: "dream",
    why: "«Когда-нибудь» и «хорошо бы» — мечта, нет срока и критерия." },
  { text: "К 15 апреля соберу команду из 4 человек и проведём 3 репетиции проекта.", answer: "goal",
    why: "Есть что, сколько, к какому сроку — цель." },
  { text: "Хочу стать программистом.", answer: "dream",
    why: "Направление есть, но нет срока и измеримого результата." },
  { text: "За 3 недели исправлю оценку по математике с 3 на 4: разберу 2 темы и решу 30 заданий.", answer: "goal",
    why: "Есть конкретика, цифры, срок — классическая SMART-цель." }
];
const state = {};

function render() {
  const box = document.getElementById('task1');
  box.innerHTML = '';
  task1Data.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="row">
        <div class="text">${i + 1}. «${item.text}»</div>
        <div class="btns">
          <button data-i="${i}" data-val="dream">Мечта</button>
          <button data-i="${i}" data-val="goal">Цель</button>
        </div>
      </div>
      <div class="feedback" id="fb1-${i}"></div>`;
    box.appendChild(div);
  });
  box.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      state[i] = btn.dataset.val;
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
    });
  });
  document.getElementById('score1').textContent = '';
}

document.getElementById('check1').addEventListener('click', () => {
  let correct = 0;
  task1Data.forEach((item, i) => {
    const fb = document.getElementById(`fb1-${i}`);
    const btns = document.querySelectorAll(`#task1 button[data-i="${i}"]`);
    btns.forEach(b => {
      b.classList.remove('correct', 'wrong', 'sel');
      if (b.dataset.val === item.answer) b.classList.add('correct');
      if (state[i] === b.dataset.val && b.dataset.val !== item.answer) b.classList.add('wrong');
    });
    fb.classList.add('show');
    if (state[i] === item.answer) {
      correct++;
      fb.textContent = '✅ Верно. ' + item.why;
      fb.className = 'feedback show ok';
    } else if (!state[i]) {
      fb.textContent = '⚠️ Не выбрано. Правильно: ' + (item.answer === 'goal' ? 'цель' : 'мечта') + '. ' + item.why;
      fb.className = 'feedback show no';
    } else {
      fb.textContent = '❌ Неверно. Это ' + (item.answer === 'goal' ? 'цель' : 'мечта') + '. ' + item.why;
      fb.className = 'feedback show no';
    }
  });
  document.getElementById('score1').textContent = `Результат: ${correct} из ${task1Data.length}`;
});

document.getElementById('reset1').addEventListener('click', () => {
  Object.keys(state).forEach(k => delete state[k]);
  render();
});

render();
</script>
</body>
</html>
